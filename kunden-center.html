<!DOCTYPE html>
<html lang="de">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kunden-Center">
<meta name="theme-color" content="#0a0a0c">
<title>TS Suite Werkzeuge — Kunden-Center</title>
<link rel="stylesheet" href="ts-theme.css">
<script src="ts-theme.js"></script>
<style>
  :root{
    /* Werte verweisen auf die zentralen --ts-*-Tokens aus ts-theme.css
       (Hell-/Dunkelmodus). Der zweite Wert je var() ist der bisherige
       Farbwert als Fallback. */
    --bg:var(--ts-bg, #0a0a0c); --surface:var(--ts-surface, #111318); --surface-hover:var(--ts-surface-hover, #141821);
    --ink:var(--ts-ink, #e9edf2); --ink-60:var(--ts-ink-60, rgba(233,237,242,.6)); --ink-45:var(--ts-ink-45, rgba(233,237,242,.45)); --ink-40:var(--ts-ink-40, rgba(233,237,242,.4));
    --accent:var(--ts-accent, #3a7bd5); --line-20:var(--ts-line-20, rgba(58,123,213,.2)); --line-30:var(--ts-line-30, rgba(58,123,213,.3)); --line-35:var(--ts-line-35, rgba(58,123,213,.35));
    --font-display:var(--ts-font-display, 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif);
    --font-mono:var(--ts-font-mono, ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-display);
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
    display:flex;flex-direction:column;}

  .ts-backbar{flex-shrink:0;display:flex;align-items:center;gap:10px;
    background:var(--bg);color:var(--ink);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
    font:600 12px/1.4 var(--font-mono);letter-spacing:.03em;border-bottom:1px solid var(--line-35);flex-wrap:wrap;}
  .ts-backbar__link{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  @media(hover:hover){ .ts-backbar__link:hover{color:var(--accent);} }
  .ts-backbar__slash{color:var(--ink-40);}
  .ts-backbar__current{color:var(--accent);font-weight:700;}

  .tabs{flex-shrink:0;display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-20);}
  .tab-btn{flex:1;padding:12px 6px;border-radius:2px;border:1px solid var(--line-30);background:var(--surface);
    font:700 12px var(--font-mono);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-60);cursor:pointer;
    min-height:44px;transition:.15s;}
  .tab-btn.active{border-color:var(--accent);color:var(--accent);background:var(--surface-hover);}
  @media(max-width:480px){ .tab-btn{font-size:10px;padding:12px 4px;letter-spacing:0;} }

  .frame-wrap{flex:1;position:relative;min-height:0;}
  .frame-panel{position:absolute;inset:0;display:none;}
  .frame-panel.active{display:block;}
  .frame-panel iframe{width:100%;height:100%;border:none;display:block;background:var(--bg);}

  .frame-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--ink-45);font:500 12.5px var(--font-mono);text-align:center;padding:20px;}
</style>
</head>
<body>

<div class="ts-backbar">
  <a href="indexpro.html" class="ts-backbar__link">&larr; TS Suite Werkzeuge</a>
  <span class="ts-backbar__slash" aria-hidden="true">/</span>
  <span class="ts-backbar__current">Kunden-Center</span>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="crm">CRM</button>
  <button class="tab-btn" data-tab="angebot">Angebote</button>
  <button class="tab-btn" data-tab="berichte">Berichte</button>
  <button class="tab-btn" data-tab="auftragsboard">Aufträge</button>
</div>

<div class="frame-wrap">
  <div class="frame-panel active" id="panel-crm">
    <div class="frame-empty" id="empty-crm">Lädt …</div>
  </div>
  <div class="frame-panel" id="panel-angebot">
    <div class="frame-empty" id="empty-angebot">Noch nicht geöffnet.</div>
  </div>
  <div class="frame-panel" id="panel-berichte">
    <div class="frame-empty" id="empty-berichte">Noch nicht geöffnet.</div>
  </div>
  <div class="frame-panel" id="panel-auftragsboard">
    <div class="frame-empty" id="empty-auftragsboard">Noch nicht geöffnet.</div>
  </div>
</div>

<script>
// Jedes Tool bleibt technisch komplett eigenständig (eigener Router, eigener Auth-Gate-
// Aufbau) — diese Hülle bindet sie nur per iframe ein und schaltet zwischen ihnen um.
// Angemeldet wird trotzdem nur einmal: ts-auth.js legt die Sitzung unter einem
// gemeinsamen localStorage-Key ab, und alle iframes laufen auf derselben Origin.
const TOOL_SRC = {
  crm: 'crm.html',
  angebot: 'angebot-generator.html',
  berichte: 'uebersicht.html',
  auftragsboard: 'auftragsboard.html'
};
const geladen = { crm: false, angebot: false, berichte: false, auftragsboard: false };

function ladeTab(tab, extraQuery){
  const panel = document.getElementById('panel-' + tab);
  let iframe = panel.querySelector('iframe');
  const src = TOOL_SRC[tab] + (extraQuery || '');
  if(!iframe){
    iframe = document.createElement('iframe');
    iframe.src = src;
    iframe.title = tab;
    panel.appendChild(iframe);
    const empty = document.getElementById('empty-' + tab);
    if(empty) empty.remove();
  } else if(extraQuery){
    // Gezielter Aufruf mit neuen Parametern (z.B. Kunde-Übergabe) -> Iframe neu laden.
    iframe.src = src;
  }
  geladen[tab] = true;
}

function wechsleTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.frame-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  if(!geladen[tab]) ladeTab(tab);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => wechsleTab(btn.dataset.tab));
});

// Erst-Tab (CRM) sofort laden, die anderen erst bei Bedarf — spart unnötige
// Logins/Requests, solange man sie nicht öffnet.
ladeTab('crm');

// Brücke für die Kunde-Übergabe aus dem CRM: dort löst der 🧾-Button in der
// Kundenkarte ein postMessage aus, das hier den Angebote-Tab aktiviert und
// den itemisierten Generator direkt mit diesem Kunden lädt.
window.addEventListener('message', (e) => {
  if(e.origin !== window.location.origin) return;
  if(e.data && e.data.tsAction === 'openAngebot' && e.data.kundeId){
    ladeTab('angebot', '?kunde_id=' + encodeURIComponent(e.data.kundeId));
    wechsleTab('angebot');
  }
});
</script>

</body>
</html>
